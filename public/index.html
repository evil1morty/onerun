<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A lightweight desktop app to manage all your dev servers in one place" />
  <title>OneRun</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="alert-bar"></div>
  <div id="app">
    <!-- Header -->
    <header id="header">
      <span class="logo">
        <img src="favicon-32x32.png" alt="" class="logo-icon" />
        OneRun
      </span>
      <div class="header-actions">
        <div class="search-wrap">
          <input type="text" id="search" placeholder="Search..." autocomplete="off" spellcheck="false" />
          <button id="search-clear" class="hidden" title="Clear search" aria-label="Clear search">&times;</button>
        </div>
        <button id="btn-add" title="Add project">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true"><path d="M7 1v12M1 7h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <button id="btn-toggle-tags" title="Hide tags" aria-label="Toggle tags">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="7" cy="7" r="1.5" fill="currentColor"/></svg>
        </button>
        <button id="btn-theme" title="Theme: System" aria-label="Toggle theme">
          <svg id="theme-icon-sun" width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true" class="hidden"><circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="2"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <svg id="theme-icon-moon" width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true" class="hidden"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
          <svg id="theme-icon-system" width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="2" y="4" width="20" height="14" rx="2" stroke="currentColor" stroke-width="2"/><path d="M8 22h8M12 18v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <button id="btn-settings" title="Settings">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z" stroke="currentColor" stroke-width="2"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" stroke="currentColor" stroke-width="2"/></svg>
        </button>
      </div>
    </header>

    <!-- Tag filter bar (top) -->
    <div id="tag-bar" class="hidden">
      <div id="tag-bar-list"></div>
      <button id="tag-clear-btn" class="hidden" title="Clear filter">Clear &times;</button>
    </div>

    <!-- Dashboard table -->
    <div id="dashboard">
      <table id="project-table">
        <thead>
          <tr>
            <th class="col-status"></th>
            <th class="col-name">Name</th>
            <th class="col-tags">Tags</th>
            <th class="col-url">URL</th>
            <th class="col-actions">Action</th>
          </tr>
        </thead>
        <tbody id="project-list"></tbody>
      </table>

      <div id="empty" class="hidden">
        <div class="empty-icon">&#128187;</div>
        <p>No projects yet</p>
        <p class="empty-sub">Add a project folder to get started</p>
        <button id="btn-add-empty">+ Add Project</button>
      </div>
    </div>

    <!-- Log panel (slides up from bottom) -->
    <div id="log-panel" class="hidden">
      <div id="log-header">
        <div class="log-title">
          <span id="log-project-name"></span>
        </div>
        <div class="log-actions">
          <button id="log-run" class="hidden" title="Start">Start</button>
          <button id="log-copy" title="Copy logs">Copy</button>
          <button id="log-clear" title="Clear logs">Clear</button>
          <button id="log-close" title="Close">Close</button>
        </div>
      </div>

      <!-- Command tabs -->
      <div id="log-tabs-wrap">
        <button id="tab-arrow-left" class="tab-arrow hidden">&#8249;</button>
        <div id="log-tabs"></div>
        <button id="tab-arrow-right" class="tab-arrow hidden">&#8250;</button>
        <div id="tab-action"></div>
      </div>

      <div id="log-output">
        <div id="log-empty" class="log-empty">Logs will appear here when you run a command</div>
      </div>
    </div>
  </div>

  <!-- 3-dot dropdown menu (positioned dynamically) -->
  <div id="context-menu" class="hidden">
    <div id="ctx-commands"></div>
    <div id="div-cmds" class="ctx-divider"></div>
    <button class="ctx-item" data-action="stop">
      <span class="ctx-icon">&#9632;</span> Stop
    </button>
    <div id="div-process" class="ctx-divider"></div>
    <button class="ctx-item" data-action="browser">
      <span class="ctx-icon">&#127760;</span> Open in Browser
    </button>
    <button class="ctx-item" data-action="claude">
      <span class="ctx-icon"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" style="vertical-align: -2px"><path fill="#ff7043" d="M4.5 6h15v5H22v2h-2.5v3h-1v2H17v-2h-1v2h-1.5v-2h-5v2H8v-2H7v2H5.5v-2h-1v-3H2v-2h2.5ZM7 8v3h1V8Zm9 0v3h1V8Z"/></svg></span> Open in Claude Code
    </button>
    <button class="ctx-item" data-action="editor">
      <span class="ctx-icon" id="editor-icon"></span> <span id="editor-label">Open in Editor</span>
    </button>
    <button class="ctx-item" data-action="terminal">
      <span class="ctx-icon"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 16 16" style="vertical-align:-2px"><path fill="currentColor" d="M2 3l5 4-5 4V3zm6 8h6v1H8v-1z"/></svg></span> <span id="terminal-label">Open in Terminal</span>
    </button>
    <button class="ctx-item" data-action="explorer">
      <span class="ctx-icon">&#128193;</span> Show in Explorer
    </button>
    <div class="ctx-divider"></div>
    <button class="ctx-item" data-action="pin">
      <span class="ctx-icon">&#128204;</span> Pin to Top
    </button>
    <button class="ctx-item" data-action="rescan">
      <span class="ctx-icon">&#8635;</span> Rescan Commands
    </button>
    <button class="ctx-item" data-action="edit">
      <span class="ctx-icon">&#9998;</span> Edit
    </button>
    <button class="ctx-item danger" data-action="remove">
      <span class="ctx-icon">&#10005;</span> Remove
    </button>
  </div>

  <!-- Add/Edit dialog -->
  <div id="dialog-overlay" class="hidden">
    <div id="dialog">
      <h3 id="dialog-title">Add Project</h3>

      <div id="add-mode-toggle">
        <button type="button" id="mode-existing" class="mode-btn active">Existing folder</button>
        <button type="button" id="mode-new" class="mode-btn">New folder</button>
      </div>

      <label id="dir-field">Project folder
        <div class="input-row">
          <input type="text" id="inp-dir" placeholder="C:\Users\you\projects\app" autocomplete="off" />
          <button id="btn-scan" title="Browse folder">Browse</button>
        </div>
      </label>

      <div id="new-dir-hint" class="hidden">An empty folder will be created in <code id="new-dir-parent"></code></div>

      <label>Name
        <input type="text" id="inp-name" placeholder="my-app" autocomplete="off" />
      </label>

      <label>Tags
        <div id="tag-input-wrap">
          <input type="text" id="inp-tag" placeholder="Add tag..." autocomplete="off" />
        </div>
        <div id="tag-suggestions" class="hidden"></div>
      </label>

      <div id="cmd-list-header">
        <span>Commands</span>
        <button id="btn-add-cmd" title="Add command">+</button>
      </div>
      <div id="cmd-list"></div>

      <div id="env-list-header">
        <span>Environment Variables</span>
        <button id="btn-add-env" title="Add env var">+</button>
      </div>
      <div id="env-list"></div>

      <div id="dialog-error" class="hidden"></div>

      <div class="dialog-actions">
        <button id="btn-cancel" class="secondary">Cancel</button>
        <button id="btn-save">Save</button>
      </div>
    </div>
  </div>

  <!-- Confirm dialog -->
  <div id="confirm-overlay" class="hidden">
    <div id="confirm-box">
      <p id="confirm-msg">Are you sure?</p>
      <div class="dialog-actions">
        <button id="confirm-no" class="secondary">Cancel</button>
        <button id="confirm-yes" class="danger">Remove</button>
      </div>
    </div>
  </div>

  <!-- Settings (full-page) -->
  <div id="settings-overlay" class="hidden">
    <div class="settings-shell">
      <header class="settings-header">
        <div class="settings-header-side settings-header-left">
          <button id="settings-cancel" class="settings-back" title="Close settings" aria-label="Close settings">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          </button>
        </div>
        <h2>Settings</h2>
        <div class="settings-header-side settings-header-right">
          <span id="settings-saved-pill" class="saved-pill">Saved</span>
        </div>
      </header>

      <div class="settings-body">
        <section class="settings-section">
          <h3>Claude Code</h3>
          <label class="field">
            <span class="field-label">Command</span>
            <input type="text" id="set-claude" placeholder="claude" autocomplete="off" />
            <span class="field-hint">e.g. <code>claude</code>, <code>claude --model opus</code>, <code>claude --dangerously-skip-permissions</code></span>
          </label>
          <label class="field">
            <span class="field-label">Opens in</span>
            <select id="set-claude-mode">
              <option value="window">New Window</option>
              <option value="tab">New Tab (Windows Terminal)</option>
            </select>
          </label>
        </section>

        <section class="settings-section">
          <h3>Editor</h3>
          <label class="field">
            <span class="field-label">Command</span>
            <input type="text" id="set-editor" placeholder="code" autocomplete="off" />
            <span class="field-hint">e.g. <code>code</code>, <code>cursor</code>, <code>zed</code>, <code>webstorm</code></span>
          </label>
        </section>

        <section class="settings-section">
          <h3>Projects</h3>
          <label class="field">
            <span class="field-label">New project location</span>
            <input type="text" id="set-projects-dir" autocomplete="off" />
            <span class="field-hint">Parent folder for projects created with "New folder"</span>
          </label>
        </section>

        <section class="settings-section">
          <h3>System</h3>
          <label class="toggle-label">
            <span>Start on boot (minimized to tray)</span>
            <input type="checkbox" id="set-autostart" />
            <span class="toggle-switch"></span>
          </label>
        </section>
      </div>

      <footer class="settings-footer">
        <span id="app-version">OneRun</span>
        <a href="#" id="about-github"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" style="vertical-align:-3px"><path fill="currentColor" d="M12 2A10 10 0 0 0 2 12c0 4.42 2.87 8.17 6.84 9.5c.5.08.66-.23.66-.5v-1.69c-2.77.6-3.36-1.34-3.36-1.34c-.46-1.16-1.11-1.47-1.11-1.47c-.91-.62.07-.6.07-.6c1 .07 1.53 1.03 1.53 1.03c.87 1.52 2.34 1.07 2.91.83c.09-.65.35-1.09.63-1.34c-2.22-.25-4.55-1.11-4.55-4.92c0-1.11.38-2 1.03-2.71c-.1-.25-.45-1.29.1-2.64c0 0 .84-.27 2.75 1.02c.79-.22 1.65-.33 2.5-.33s1.71.11 2.5.33c1.91-1.29 2.75-1.02 2.75-1.02c.55 1.35.2 2.39.1 2.64c.65.71 1.03 1.6 1.03 2.71c0 3.82-2.34 4.66-4.57 4.91c.36.31.69.92.69 1.85V21c0 .27.16.59.67.5C19.14 20.16 22 16.42 22 12A10 10 0 0 0 12 2"/></svg> GitHub</a>
      </footer>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
